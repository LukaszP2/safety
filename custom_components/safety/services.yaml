update_settings:
  name: "Update settings"
  description: "Updates configuration settings for Safety Hub."
  fields:
    category:
      name: "Category"
      description: "Hazard category (e.g. water, fire, gas, temperature, power, global)."
      required: true
      selector:
        text:
    key:
      name: "Key"
      description: "Setting key (e.g. sensors, actuators, auto_config)."
      required: true
      selector:
        text:
    value:
      name: "Value"
      description: "New value for the specified setting key."
      required: true
      selector:
        object:

toggle_service_mode:
  name: "Toggle service mode"
  description: "Toggles global service mode on or off to suppress alerts during maintenance."

test_alert:
  name: "Test alert"
  description: "Triggers a simulated hazard alert for testing notification and action channels."
  fields:
    category:
      name: "Category"
      description: "Hazard category to test (water, fire, gas, temperature, power)."
      required: true
      selector:
        text:
    execute_actions:
      name: "Execute actions"
      description: "Whether to execute automated physical actions (e.g. valves/switches) during the test."
      required: false
      default: false
      selector:
        boolean:

dismiss_alert:
  name: "Dismiss alert"
  description: "Dismisses active alerts for a specified hazard category and cancels reminder loops."
  fields:
    category:
      name: "Category"
      description: "Hazard category to dismiss (water, fire, gas, temperature, power)."
      required: true
      selector:
        text:
